name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Lint
        run: npm ci && npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build
        run: npm ci && npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ooo-technoseti:latest
          push: false

      - name: Save image to artifact
        run: docker save ooo-technoseti:latest | gzip > image.tar.gz

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          docker save ooo-technoseti:latest | ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key root@$VPS_HOST 'docker load'
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key root@$VPS_HOST 'docker stop ooo-technoseti 2>/dev/null || true; docker rm ooo-technoseti 2>/dev/null || true; docker run -d --name ooo-technoseti --restart unless-stopped -p 3000:3000 ooo-technoseti:latest; docker image prune -f'
