name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Lint
        run: npm ci && npm run lint

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ooo-technoseti:latest
          push: false

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          docker save ooo-technoseti:latest | ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key root@$VPS_HOST 'docker load'
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key root@$VPS_HOST 'docker stop ooo-technoseti 2>/dev/null || true; docker rm ooo-technoseti 2>/dev/null || true; docker run -d --name ooo-technoseti --restart unless-stopped -p 3000:3000 ooo-technoseti:latest; docker image prune -f'
